services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8889:8889"
      - "8189:8189/udp"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_HOST:-127.0.0.1}

  server:
    image: ${IMAGE_PREFIX:-ghcr.io/liorbuch/phij}-server:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --timeout-keep-alive
      - "30"
    restart: unless-stopped
    environment:
      STREAM_NAME: dog-cam
      WHEP_URL: ${NEXT_PUBLIC_WHEP_URL:-http://localhost:8889/dog-cam/whep}
      CAMERA_STALE_AFTER_SECONDS: 15
      CORS_ORIGIN: "*"
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/liorbuch/phij}-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on: [server, mediamtx]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  camera:
    image: ${IMAGE_PREFIX:-ghcr.io/liorbuch/phij}-camera:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: services/camera/Dockerfile
    restart: unless-stopped
    environment:
      CAMERA_ID: dog-cam
      CAMERA_RTSP_URL: ${CAMERA_RTSP_URL:-}
      CAMERA_RTSP_TRANSPORT: ${CAMERA_RTSP_TRANSPORT:-tcp}
      CAMERA_VIDEO_CODEC: ${CAMERA_VIDEO_CODEC:-copy}
      CAMERA_BITRATE: ${CAMERA_BITRATE:-1800k}
      CAMERA_AUDIO_CODEC: ${CAMERA_AUDIO_CODEC:-libopus}
      CAMERA_AUDIO_BITRATE: ${CAMERA_AUDIO_BITRATE:-64k}
      CAMERA_RTSP_IO_TIMEOUT_SECONDS: ${CAMERA_RTSP_IO_TIMEOUT_SECONDS:-15}
      MEDIA_MTX_RTSP_URL: rtsp://mediamtx:8554/dog-cam
      MEDIA_MTX_API_URL: http://mediamtx:9997
      PUBLISHER_STARTUP_GRACE_SECONDS: ${PUBLISHER_STARTUP_GRACE_SECONDS:-15}
      PUBLISHER_UNREADY_CHECKS: ${PUBLISHER_UNREADY_CHECKS:-2}
      API_URL: http://server:4000
      HEARTBEAT_INTERVAL_SECONDS: 5
    depends_on: [server, mediamtx]

  test-stream:
    image: linuxserver/ffmpeg:latest
    profiles: ["test-stream"]
    depends_on: [mediamtx]
    command:
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=25
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/dog-cam

  test-heartbeat:
    image: curlimages/curl:latest
    profiles: ["test-stream"]
    depends_on: [server]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST http://server:4000/api/cameras/heartbeat \
            -H 'Content-Type: application/json' \
            -d '{"cameraId":"dog-cam","state":"streaming","message":"Synthetic test stream"}' || true
          sleep 5
        done
