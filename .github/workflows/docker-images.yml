name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish for all Docker images
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: server
            dockerfile: apps/server/Dockerfile
          - service: camera
            dockerfile: services/camera/Dockerfile

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image-tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          IMAGE_NAME="ghcr.io/${REPOSITORY,,}-$SERVICE"
          {
            echo 'tags<<EOF'
            echo "$IMAGE_NAME:latest"
            echo "$IMAGE_NAME:${{ github.sha }}"
            if [ -n "$RELEASE_TAG" ]; then
              echo "$IMAGE_NAME:$RELEASE_TAG"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  create-release-tag:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create repository tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
